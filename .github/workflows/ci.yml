# The tool checks itself: the suite, the selftest, and the template every consumer copies.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The floor and the current release. **The floor is real**: a `commit-msg` hook runs
        # this on whatever python the machine has, and macOS still ships 3.9.6 as
        # `/usr/bin/python3`, so breaking 3.9 breaks the hook on a laptop rather than in CI.
        #
        # 3.9 is pinned to ubuntu-22.04 because `setup-python` has no 3.9 build for Ubuntu
        # 26.04, which is what `ubuntu-latest` now is: the first run of this workflow failed
        # with "The version '3.9' with architecture 'x64' was not found for Ubuntu 26.04".
        include:
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - run: python spec_check.py --selftest
      # The template is documentation that has to stay valid, so it is checked as a spec
      # rather than trusted to still parse.
      - run: python spec_check.py spec examples/SPEC-TEMPLATE.md
      # The README's rule section is generated from the constants the enforcement reads, so
      # a rules change that forgets `docs --write` turns this repository's own CI red. If the
      # tool cannot keep its own documentation current, the consumers have no reason to.
      - run: python spec_check.py docs --check README.md
